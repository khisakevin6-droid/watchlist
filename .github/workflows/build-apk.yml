
name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Run unit tests
        run: gradle :app:testDebugUnitTest

      - name: Build release APK
        run: gradle :app:assembleRelease

      - name: Verify APK exists
        run: test -f app/build/outputs/apk/release/app-release.apk

      - name: Prepare APK
        run: cp app/build/outputs/apk/release/app-release.apk KevvWatchlist.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KevvWatchlist-apk
          path: KevvWatchlist.apk
          if-no-files-found: error
